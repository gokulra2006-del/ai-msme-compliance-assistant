<svg viewBox="0 0 400 400" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(59, 130, 246, 0.15)" />
      <stop offset="100%" stop-color="rgba(0, 230, 118, 0.05)" />
    </linearGradient>
    <linearGradient id="sGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#00E676" />
    </linearGradient>
  </defs>

  <!-- Shield Outline -->
  <path d="M 200 40 L 320 80 L 320 220 C 320 300 200 360 200 360 C 200 360 80 300 80 220 L 80 80 Z" fill="url(#shieldGrad)" stroke="rgba(59, 130, 246, 0.6)" stroke-width="3" />

  <!-- The "S" Curve Ribbon -->
  <path d="M 300 110 C 180 110 120 180 200 210 C 280 240 220 310 100 310" fill="none" stroke="url(#sGrad)" stroke-width="28" stroke-linecap="round" />

  <!-- The Bridge -->
  <g>
    <path d="M 192 180 L 208 180 L 214 340 L 186 340 Z" fill="#0f172a" stroke="#3b82f6" stroke-width="1.5" />
    <path d="M 200 180 L 208 180 L 214 340 L 200 340 Z" fill="rgba(59, 130, 246, 0.2)" />
    <path d="M 80 260 Q 200 245 320 260 L 320 270 Q 200 255 80 270 Z" fill="#0f172a" stroke="#3b82f6" stroke-width="1.5" />
    <path d="M 200 180 L 80 260 M 200 180 L 320 260" stroke="#00E676" stroke-width="2.5" fill="none" />
    
    <!-- Left Cables -->
    <line x1="120" y1="244" x2="120" y2="258" stroke="rgba(0, 230, 118, 0.6)" stroke-width="1.5" />
    <line x1="140" y1="228" x2="140" y2="257" stroke="rgba(0, 230, 118, 0.6)" stroke-width="1.5" />
    <line x1="160" y1="212" x2="160" y2="255.5" stroke="rgba(0, 230, 118, 0.6)" stroke-width="1.5" />
    <line x1="180" y1="196" x2="180" y2="254" stroke="rgba(0, 230, 118, 0.6)" stroke-width="1.5" />
    
    <!-- Right Cables -->
    <line x1="280" y1="244" x2="280" y2="258" stroke="rgba(0, 230, 118, 0.6)" stroke-width="1.5" />
    <line x1="260" y1="228" x2="260" y2="257" stroke="rgba(0, 230, 118, 0.6)" stroke-width="1.5" />
    <line x1="240" y1="212" x2="240" y2="255.5" stroke="rgba(0, 230, 118, 0.6)" stroke-width="1.5" />
    <line x1="220" y1="196" x2="220" y2="254" stroke="rgba(0, 230, 118, 0.6)" stroke-width="1.5" />
  </g>
</svg>
